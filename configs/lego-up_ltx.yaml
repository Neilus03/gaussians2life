# -------------------------------------------------------------------- #
#  Gaussians-to-Life — lego-up scene, LTX-Video guidance
# -------------------------------------------------------------------- #
name: "lego-up_ltx"
tag: "${rmspace:${system.prompt_processor.prompt},_}"
exp_root_dir: "outputs_ltx"
seed: 0

trainer:
  max_steps: 8
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  val_check_interval: 1
  enable_progress_bar: true
  precision: 32              # keep full-precision maths in G2L

# -------------------------------------------------------------------- #
#  Camera / datamodule
# -------------------------------------------------------------------- #
data_type: "4dgs-multi-view-sample-once-datamodule"
data:
  height: 320
  width: 512
  num_frames: 32
  eval_frames: 32
  eval_height: 640
  eval_width: 1024
  test_height: 1080
  test_width: 1920
  test_extension: 1.0

  azimuth_range:    [-150., 150.]
  elevation_range:  [ -10.,  10.]
  distance_range:   [ -0.1,  0.1]
  std_azimuth:   0.05
  std_elevation: 0.05
  std_distance:  0.01
  fovx_range:  [60, 60]
  fovy_range:  [40, 40]
  eval_fovx_deg: 60
  eval_fovy_deg: 40
  eval_radius:   0.2

  camera_up:      [0., 0., 1.]
  camera_lookat: [ -0.0649, -0.0511, -0.0633 ]
  anchor_view:    [ 0.27, 1.53, 0.55 ]

  num_views_per_direction: 10
  num_optimization_steps_before_resampling: 0
  random_views: false

# -------------------------------------------------------------------- #
#  Gaussians-to-Life system
# -------------------------------------------------------------------- #
system_type: "gauss-trajectory-4d-system"
system:
  debug: true
  save_debug_artifacts: true
  geometry_type: "gaussian-splatting-trajectories"
  back_ground_color: [1.0, 1.0, 1.0]
  last_step_rigid: false

  geometry:
    sh_degree: 0
    geometry_convert_from: "custom/gaussians2life/assets/sample_data/kitchenlego.ply"
    num_frames: ${data.num_frames}
    update_scale:      false
    update_rotation:   true
    num_nearest_neighbors:              50
    anchor_view_multiplier:             2
    num_nearest_neighbors_inference:   250
    knn_weighting: 0.0
    mask_box: [ [ -1.0491, 1.4259, 2.0784 ],[ -0.4617, 2.5713, 0.6840 ],[ -0.2292, 1.2610, 2.2884 ],[ -1.0424, 0.6289, 1.4265 ],[ 0.3649, 1.6094, 0.2421 ],[ -0.2225, 0.4640, 1.6365 ],[ -0.4550, 1.7743, 0.0321 ],[ 0.3583, 2.4064, 0.8940 ] ]
    box_rot_x: 90
    inference_mode: "displacement"

  material_type: "no-material"
  material:
    n_output_dims: 0

  background_type: "solid-color-background"

  renderer_type: "diff-gaussian-rasterizer-dynamic"
  renderer:
    debug: false
    invert_bg_prob: 1.0

  # ------------------------------------------------------------ #
  #  prompt processor (not used by LTX)
  # ------------------------------------------------------------ #
  prompt_processor_type: ""
  prompt_processor:
    prompt: ???

  # ------------------------------------------------------------ #
  #  LTX-Video guidance
  # ------------------------------------------------------------ #
  guidance_type: "ltx-video-guidance"
  guidance:
    pipeline_config: "custom/gaussians2life/guidance/LTX-Video/configs/ltxv-2b-0.9.6-distilled.yaml"
    ckpt_path:       "custom/gaussians2life/guidance/LTX-Video/MODEL_DIR/ltxv-2b-0.9.6-distilled-04-25.safetensors"

    prompt:           ""          # sbatch supplies
    negative_prompt:  "worst quality, low quality, blurry, inconsistent motion, jittery, distorted"
    guidance_scale:   1

    height:           ${data.height}
    width:            ${data.width}
    num_frames:       32
    frame_rate:       16 

    #anchor_viewpoint_sample_path: ""
    anchor_viewpoint_sample_path: "custom/gaussians2life/assets/sample_initial_videos/lego-up_forwardfast2.mp4"

# -------------------------------------------------------------------- #
#  Check-pointing
# -------------------------------------------------------------------- #
checkpoint:
  save_last: true
  save_top_k: 0
  every_n_train_steps: ${trainer.max_steps}
