name: "gardenvase-ltx"
tag: "${rmspace:${system.prompt_processor.prompt},_}"
exp_root_dir: "outputs_ltx"
seed: 0

trainer:
  max_steps: 13
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  val_check_interval: 1
  enable_progress_bar: true
  precision: 32

data_type: "4dgs-multi-view-sample-once-datamodule"
data:
  height: 320
  width: 512
  num_frames: 64
  eval_frames: 64
  eval_height: 640
  eval_width: 1024
  test_height: 1080
  test_width: 1920
  test_extension: 1.5

  azimuth_range: [ -180., 180. ]
  elevation_range: [ -5., 20. ]
  distance_range: [ -0.1, 0.1 ]
  std_azimuth: 0.05
  std_elevation: 0.05
  std_distance: 0.01
  fovx_range: [ 60, 60 ]
  fovy_range: [ 40, 40 ]
  eval_fovx_deg: 60
  eval_fovy_deg: 40
  eval_radius: 0.0

  camera_up: [ 0., 0., 1. ]
  camera_lookat: [ 0., 0., 0. ]
  anchor_view: [ -1.4, 2.0, 1.0 ]

  num_views_per_direction: 6
  num_optimization_steps_before_resampling: 0
  random_views: false

  fixed_view: ${system.use_optimization}

system_type: "gauss-trajectory-4d-system"
system:
  debug: true
  save_debug_artifacts: true
  geometry_type: "gaussian-splatting-trajectories"
  back_ground_color: [ 1.0, 1.0, 1.0 ]
  last_step_rigid: false
  use_optimization: false

  optimizer:
    optimizer_type: "Adam"
    args:
      lr: 0.0003
      betas: [0.9, 0.999]
      
  loss:
    lambda_l1: 0.8
    lambda_lpips: 0.2
    lambda_ssim: 0.0

  geometry:
    sh_degree: 0
    geometry_convert_from: "custom/gaussians2life/assets/sample_data/gardenvase.ply"
    mask_path: "custom/gaussians2life/assets/sample_data/mask_gardenvase.pt"
    num_frames: ${data.num_frames}
    update_scale: false
    update_rotation: true
    anchor_view_multiplier: 2
    num_nearest_neighbors: 125
    num_nearest_neighbors_inference: 250
    knn_weighting: 0.0

    box_rot_x: 10
    box_rot_y: 270
    box_rot_z: 0

    inference_mode: "rigid"

  material_type: "no-material" # unused
  material:
    n_output_dims: 0

  background_type: "solid-color-background" # unused

  renderer_type: "diff-gaussian-rasterizer-dynamic"
  renderer:
    debug: false
    invert_bg_prob: 1.0

  prompt_processor_type: ""
  prompt_processor:
    prompt: ???

  guidance_type: "ltx-video-guidance"
  guidance:
    pipeline_config: "custom/gaussians2life/guidance/LTX-Video/configs/ltxv-2b-0.9.6-distilled.yaml"
    ckpt_path:       "custom/gaussians2life/guidance/LTX-Video/MODEL_DIR/ltxv-2b-0.9.6-distilled-04-25.safetensors"

    prompt:           ""          # sbatch supplies
    negative_prompt:  "worst quality, low quality, blurry, inconsistent motion, jittery, distorted"
    guidance_scale:   1

    height:           ${data.height}
    width:            ${data.width}
    num_frames: ${data.num_frames}


    frame_rate:       24 

    anchor_viewpoint_sample_path: "custom/gaussians2life/assets/sample_initial_videos/gardenvase_implodes.mp4"

checkpoint:
  save_last: true
  save_top_k: 0
  every_n_train_steps: ${trainer.max_steps}
